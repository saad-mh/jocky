name: Polymorphic Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  polymorphic-build:
    name: Polymorphic build — unique hash verification
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap LLVM 18 vendor SDK
        shell: pwsh
        run: .\scripts\bootstrap.ps1

      - name: Configure (release preset)
        run: cmake --preset release

      - name: Build jocky compiler
        run: cmake --build build --preset release --target jocky

      - name: Polymorphic build of jocky-mem
        shell: pwsh
        run: |
          .\scripts\ci-build.ps1 -Source forensic\mem\jocky-mem.jk `
                                  -OutDir build\out `
                                  -BuildDir build\Release

      - name: Upload build manifest
        uses: actions/upload-artifact@v4
        with:
          name: polymorphic-manifest
          path: build-artifacts/manifest.json
          if-no-files-found: error

      - name: Upload polymorphic binary
        uses: actions/upload-artifact@v4
        with:
          name: jocky-mem-polymorphic
          path: build/out/jocky-mem.exe
          if-no-files-found: error
